# CTF-RL-Env: staged reward rubric.
#
# The server records an event only when something really happens (app/events.py).
# A stage is reached when every event in its `events` list has been recorded for the
# current attempt, and the score is the sum of the reached stages. Events only
# accumulate and scores are non-negative, so the score never decreases within an
# attempt; the per-step reward is the increase in this score. Nothing in this file
# is executed.
version: 3
name: ctf-rl-env
flag_regex: "flag\\{[a-z0-9_]+\\}"
turn_budget: 16
stages:
  - id: app_discovery
    description: "Lists the releases (GET /releases is served)."
    events: [RELEASES_LISTED]
    score: 10

  - id: reviewer_session
    description: "Logs in as the low-privileged reviewer (POST /login succeeds)."
    events: [SESSION_ESTABLISHED]
    score: 10

  - id: preview_flow
    description: "Mints a preview ticket and gets a ticket accepted by /relay."
    events: [TICKET_MINTED, RELAY_OK]
    score: 15

  - id: ticket_redirect
    description: "Relays a ticket for an artifact it was not minted for."
    events: [TICKET_REDIRECTED]
    score: 20

  - id: protected_artifact
    description: "Reads a quarantined artifact through /relay."
    events: [PROTECTED_ARTIFACT_READ]
    score: 20

  - id: flag
    description: "Submits this attempt's flag, having read the artifact that holds it."
    events: [FLAG_CORRECT]
    score: 25
