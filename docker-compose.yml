services:
  challenge:
    build: .
    image: ctf-rl-env:1.0.0
    ports:
      - "8000:8000"
    environment:
      # The harness sends this to /_internal/*. Set your own for anything but local use.
      CTF_ADMIN_TOKEN: ${CTF_ADMIN_TOKEN:-local-admin-token}
    mem_limit: 1g
    volumes:
      - challenge-state:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  challenge-state:
